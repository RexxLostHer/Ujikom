<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi Siswa — SMK Negeri 1 Sumedang</title>
<link rel="stylesheet" href="assets/style.css?v=20261001_9">
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --dark-bg: #070b14;
    --card-bg: rgba(255, 255, 255, 0.98);
  }

  body {
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    background: radial-gradient(at 15% 15%, rgba(37, 99, 235, 0.22) 0px, transparent 55%),
                radial-gradient(at 85% 85%, rgba(124, 58, 237, 0.2) 0px, transparent 55%),
                var(--dark-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: #0f172a;
    overflow-x: hidden;
    box-sizing: border-box;
  }

  /* CONTAINER SPLIT 2-KOLOM DESKTOP */
  .portal-auth-container {
    width: 100%;
    max-width: 1060px;
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    position: relative;
    z-index: 1;
    animation: containerEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes containerEntrance {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* SISI KIRI: 3D INTERACTIVE EMBLEM SHOWCASE (BERSIH DARI DISTRAKSI TEKS) */
  .showcase-side {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 10px 0;
  }

  /* 3D WEBGL STAGE */
  .stage-3d-container {
    position: relative;
    width: 100%;
    height: 520px;
    border-radius: 28px;
    overflow: hidden;
    background: radial-gradient(circle at center, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 70%, transparent 100%);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    user-select: none;
  }

  .stage-3d-container:active {
    cursor: grabbing;
  }

  #canvas3d {
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
  }

  /* SISI KANAN: ELEVATED LOGIN CARD */
  .auth-card-side {
    width: 100%;
    max-width: 440px;
    flex-shrink: 0;
  }

  .login-card {
    background: var(--card-bg);
    border-radius: 28px;
    padding: 36px 32px;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.15);
    position: relative;
    overflow: hidden;
    transform-style: preserve-3d;
    transition: box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.6s ease;
  }

  .login-card.card-morph-to-reg {
    animation: cardMorphToReg 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .login-card.card-morph-to-log {
    animation: cardMorphToLog 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes cardMorphToReg {
    0% { transform: perspective(1200px) rotateY(0deg) scale(1); }
    35% { transform: perspective(1200px) rotateY(10deg) translateX(12px) scale(0.96); box-shadow: 0 35px 70px -15px rgba(124, 58, 237, 0.4); }
    100% { transform: perspective(1200px) rotateY(0deg) translateX(0) scale(1); }
  }

  @keyframes cardMorphToLog {
    0% { transform: perspective(1200px) rotateY(0deg) scale(1); }
    35% { transform: perspective(1200px) rotateY(-10deg) translateX(-12px) scale(0.96); box-shadow: 0 35px 70px -15px rgba(37, 99, 235, 0.4); }
    100% { transform: perspective(1200px) rotateY(0deg) translateX(0) scale(1); }
  }

  .brand-header {
    text-align: center;
    margin-bottom: 22px;
  }

  .brand-logo-flipper {
    width: 64px;
    height: 64px;
    margin: 0 auto 12px;
    perspective: 800px;
  }

  .flipper-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .flipper-inner.is-flipped {
    transform: rotateY(180deg);
  }

  .logo-face {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    box-sizing: border-box;
    box-shadow: 0 10px 24px -4px rgba(79, 70, 229, 0.35);
  }

  .logo-face.front-nesas {
    background: #ffffff;
    border: 2px solid #e0e7ff;
  }

  .logo-face.back-rpl {
    background: #0f172a;
    border: 2px solid #818cf8;
    transform: rotateY(180deg);
    box-shadow: 0 10px 24px -4px rgba(129, 140, 248, 0.4);
  }

  .logo-face img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .brand-header h1 {
    font-size: 22px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .brand-header p {
    font-size: 13.5px;
    color: #64748b;
    margin-top: 4px;
    margin-bottom: 0;
  }

  /* TOMBOL GOOGLE 1-KLIK */
  .btn-google-smart {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 13px;
    background: #ffffff;
    color: #1e293b;
    border: 1.5px solid #e2e8f0;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none;
  }

  .btn-google-smart:hover {
    border-color: #4285f4;
    background: #f8faff;
    transform: translateY(-2px);
    box-shadow: 0 8px 18px -2px rgba(66, 133, 244, 0.2);
  }

  .btn-google-smart:active {
    transform: translateY(0);
  }

  .btn-google-smart img {
    width: 20px;
    height: 20px;
  }

  /* SEPARATOR LINE */
  .sep-line {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 18px 0;
  }

  .sep-line::before, .sep-line::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e2e8f0;
  }

  .sep-line span {
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* TAB SLIDER SMOOTH */
  .switch-tabs-wrap {
    position: relative;
    display: flex;
    background: #f1f5f9;
    padding: 4px;
    border-radius: 14px;
    margin-bottom: 20px;
    user-select: none;
  }

  .tab-slider {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc(50% - 4px);
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 1;
  }

  .switch-tabs-wrap.is-register .tab-slider {
    transform: translateX(100%);
  }

  .switch-btn {
    position: relative;
    z-index: 2;
    flex: 1;
    padding: 10px 0;
    font-size: 13.5px;
    font-weight: 700;
    color: #64748b;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: color 0.2s ease;
    text-align: center;
  }

  .switch-btn.active {
    color: #4f46e5;
  }

  /* FORM VIEW TRANSITIONS */
  .form-view-container {
    position: relative;
    min-height: 200px;
  }

  .form-view {
    opacity: 0;
    transform: translateY(8px);
    display: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .form-view.active {
    display: block;
    animation: formFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes formFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-group-item {
    margin-bottom: 14px;
  }

  .form-group-item label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: #334155;
    margin-bottom: 6px;
    transition: color 0.2s;
  }

  .input-with-icon {
    position: relative;
  }

  .input-with-icon input {
    width: 100%;
    padding: 12px 14px 12px 38px;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    font-size: 14px;
    background: #f8fafc;
    transition: all 0.22s ease;
    box-sizing: border-box;
    font-family: inherit;
    color: #0f172a;
  }

  .input-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: #94a3b8;
    pointer-events: none;
    transition: color 0.2s;
  }

  .input-with-icon input:focus {
    outline: none;
    background: #ffffff;
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
  }

  .input-with-icon.has-toggle input {
    padding-right: 44px;
  }

  .btn-toggle-eye {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    transition: color 0.2s, background-color 0.2s;
  }

  .btn-toggle-eye:hover {
    color: #4f46e5;
    background: #eef2ff;
  }

  .btn-toggle-eye svg {
    display: block;
    width: 18px;
    height: 18px;
  }

  .forgot-pass-link {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: #4f46e5;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s;
  }

  .forgot-pass-link:hover {
    color: #3730a3;
    text-decoration: underline;
  }

  /* MODAL RESET PASSWORD */
  .modal-reset-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1200;
    padding: 16px;
  }

  .modal-reset-card {
    background: #ffffff;
    border-radius: 24px;
    width: 100%;
    max-width: 420px;
    padding: 28px;
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.2);
    box-sizing: border-box;
  }

  .modal-reset-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }

  .modal-reset-header h3 {
    font-size: 18px;
    font-weight: 800;
    color: #0f172a;
    margin: 0;
  }

  .modal-reset-header p {
    font-size: 13px;
    color: #64748b;
    margin: 4px 0 0;
    line-height: 1.45;
  }

  .btn-close-modal {
    background: #f1f5f9;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    color: #64748b;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .btn-close-modal:hover {
    background: #e2e8f0;
    color: #0f172a;
  }

  /* SUBMIT BUTTON DENGAN SHIMMER */
  .btn-submit-action {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }

  .btn-submit-action:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px -2px rgba(79, 70, 229, 0.45);
  }

  .btn-submit-action:active {
    transform: translateY(0);
  }

  .btn-submit-action::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    transform: skewX(-20deg);
  }

  .btn-submit-action:hover::after {
    left: 200%;
    transition: left 0.7s ease;
  }

  /* TOAST ALERT */
  #notifBox {
    margin-top: 14px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 10px;
    display: none;
    line-height: 1.45;
    animation: notifSlideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes notifSlideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #notifBox.error {
    display: block;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #dc2626;
  }

  #notifBox.success {
    display: block;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    color: #059669;
  }

  .switch-caption {
    margin-top: 18px;
    font-size: 13px;
    color: #64748b;
    text-align: center;
  }

  .switch-caption a {
    color: #4f46e5;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }

  .switch-caption a:hover {
    color: #4338ca;
    text-decoration: underline;
  }

  /* LOADING OVERLAY */
  #loadingBox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(7, 11, 20, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 1000;
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    gap: 14px;
  }

  #loadingBox.show { display: flex; }

  .spin-wheel {
    width: 40px;
    height: 40px;
    border: 3.5px solid rgba(255, 255, 255, 0.2);
    border-top-color: #818cf8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* RESPONSIVE LAYOUT */
  @media (max-width: 960px) {
    .portal-auth-container {
      flex-direction: column;
      justify-content: center;
      gap: 24px;
    }
    .showcase-side {
      width: 100%;
      text-align: center;
      padding: 0;
    }
    .showcase-desc {
      max-width: 100%;
    }
    .stage-3d-container {
      height: 270px;
    }
    .auth-card-side {
      max-width: 440px;
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 16px 12px;
    }
    .login-card {
      padding: 28px 20px;
      border-radius: 22px;
    }
    .showcase-title {
      font-size: 24px;
    }
    .stage-3d-container {
      height: 220px;
    }
  }
</style>
</head>
<body>
  <!-- LOADING OVERLAY -->
  <div id="loadingBox">
    <div class="spin-wheel"></div>
    <span id="loadingCaption">Memproses...</span>
  </div>

  <div class="portal-auth-container">

    <!-- SISI KIRI: 3D REALTIME MEDALLION SHOWCASE (SMKN 1 SUMEDANG / RPL - BERSIH 100%) -->
    <div class="showcase-side">
      <!-- STAGE 3D INTERAKTIF (BERSIH DARI DISTRAKSI HEADER & BADGE) -->
      <div class="stage-3d-container" id="stage3dContainer">
        <canvas id="canvas3d"></canvas>
      </div>
    </div>

    <!-- SISI KANAN: LOGIN & REGISTER CARD -->
    <div class="auth-card-side">
      <div class="login-card">
        
        <!-- BRAND HEADER DENGAN 3D LOGO FLIPPER -->
        <div class="brand-header">
          <div class="brand-logo-flipper">
            <div class="flipper-inner" id="brandLogoFlipper">
              <!-- MUKA DEPAN: LOGO NESAS (LOGIN) -->
              <div class="logo-face front-nesas">
                <img src="assets/logo-nesas.png" alt="Logo SMKN 1 Sumedang (NESAS)">
              </div>
              <!-- MUKA BELAKANG: LOGO RPL (REGISTER) -->
              <div class="logo-face back-rpl">
                <img src="assets/logo-rpl.png" alt="Logo Jurusan RPL Nesas">
              </div>
            </div>
          </div>
          <h1 id="cardTitle">Presensi Siswa</h1>
          <p id="cardSubtitle">Portal Presensi RFID & Akademik SMKN 1 Sumedang</p>
        </div>

        <!-- 1-KLIK GOOGLE SIGN-IN -->
        <button class="btn-google-smart" id="btnGoogle" onclick="handleGoogleLogin()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
          Masuk dengan Google
        </button>

        <div class="sep-line">
          <span>atau dengan email</span>
        </div>

        <!-- SEGMENTED TABS DENGAN SLIDER HALUS -->
        <div class="switch-tabs-wrap" id="switchTabsWrap">
          <div class="tab-slider" id="tabSlider"></div>
          <button class="switch-btn active" id="tabMasuk" onclick="gantiTab('login')">Masuk</button>
          <button class="switch-btn" id="tabDaftar" onclick="gantiTab('register')">Daftar</button>
        </div>

        <!-- FORM CONTAINER -->
        <div class="form-view-container">
          
          <!-- FORM LOGIN -->
          <form id="formLogin" class="form-view active" onsubmit="handleLoginEmail(event)">
            <div class="form-group-item">
              <label for="loginEmail">Email Gmail</label>
              <div class="input-with-icon">
                <input type="email" id="loginEmail" placeholder="nama@gmail.com" required autocomplete="email">
                <span class="input-icon">✉️</span>
              </div>
            </div>

            <div class="form-group-item">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <label for="loginPassword" style="margin-bottom:0;">Kata Sandi</label>
                <a href="javascript:void(0)" onclick="bukaModalLupaPassword()" class="forgot-pass-link">Lupa kata sandi?</a>
              </div>
              <div class="input-with-icon has-toggle">
                <input type="password" id="loginPassword" placeholder="Masukkan kata sandi" required autocomplete="current-password">
                <span class="input-icon">🔒</span>
                <button type="button" class="btn-toggle-eye" onclick="togglePassword('loginPassword', this)" aria-label="Lihat kata sandi" title="Lihat/Sembunyikan Kata Sandi">
                  <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-closed" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="btn-submit-action" id="btnActionLogin">Masuk Sekarang</button>
          </form>

          <!-- FORM REGISTER (Khusus Siswa & Wali Murid RPL: Hanya 3 Input Bersih) -->
          <form id="formRegister" class="form-view" onsubmit="handleRegisterEmail(event)">
            <div class="form-group-item">
              <label for="regNama">Nama Lengkap</label>
              <div class="input-with-icon">
                <input type="text" id="regNama" placeholder="Nama lengkap siswa atau wali murid" required autocomplete="name">
                <span class="input-icon">👤</span>
              </div>
            </div>

            <div class="form-group-item">
              <label for="regEmail">Email Gmail</label>
              <div class="input-with-icon">
                <input type="email" id="regEmail" placeholder="nama@gmail.com" required autocomplete="email">
                <span class="input-icon">✉️</span>
              </div>
            </div>

            <div class="form-group-item">
              <label for="regPassword">Kata Sandi (Min. 6 Karakter)</label>
              <div class="input-with-icon has-toggle">
                <input type="password" id="regPassword" placeholder="Minimal 6 karakter" minlength="6" required autocomplete="new-password">
                <span class="input-icon">🔒</span>
                <button type="button" class="btn-toggle-eye" onclick="togglePassword('regPassword', this)" aria-label="Lihat kata sandi" title="Lihat/Sembunyikan Kata Sandi">
                  <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-closed" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <script src="assets/three.min.js"></script>

  <!-- 3D ENGINE & TAB CONTROLLER -->
  <script>
    // ===== 1. KONTROLER 3D THREE.JS (DUAL SCENE: LOGIN & REGISTER WAJIB BEDA) =====
    let scene, camera, renderer;
    let login3DGroup, register3DGroup;
    let currentAuthMode = 'login';
    let loginScale = 1.0, targetLoginScale = 1.0;
    let registerScale = 0.001, targetRegisterScale = 0.001;
    let targetRotationY = 0;
    let currentRotationY = 0;
    let isDragging = false;
    let previousMouseX = 0;
    let mouseTiltX = 0;
    let mouseTiltY = 0;
    let currentTiltX = 0;
    let currentTiltY = 0;
    let orbitalRing1, orbitalRing2, particleField;
    let bluePointLight, purplePointLight;
    let regWireframe, regCrystal, regGimbal1, regGimbal2, regGimbal3, regSatellites = [];

    function init3DScene() {
      const container = document.getElementById('stage3dContainer');
      const canvas = document.getElementById('canvas3d');
      const width = container.clientWidth;
      const height = container.clientHeight;

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
      camera.position.set(0, 0, 9.2);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Lighting Setup
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
      dirLight.position.set(5, 8, 7);
      scene.add(dirLight);

      bluePointLight = new THREE.PointLight(0x2563eb, 2.8, 16);
      bluePointLight.position.set(-4, -2, 5);
      scene.add(bluePointLight);

      purplePointLight = new THREE.PointLight(0x06b6d4, 2.8, 16);
      purplePointLight.position.set(4, 3, -4);
      scene.add(purplePointLight);

      // ==========================================
      // MODEL 3D #1: LOGIN (CYBER MEDALLION RFID GATEWAY)
      // ==========================================
      login3DGroup = new THREE.Group();
      scene.add(login3DGroup);

      // 1. Cyber Cylinder Rim (Metallic Edge)
      const rimGeom = new THREE.CylinderGeometry(2.85, 2.85, 0.36, 64, 1, true);
      rimGeom.rotateX(Math.PI / 2);
      const rimMat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        metalness: 0.95,
        roughness: 0.15
      });
      const rimMesh = new THREE.Mesh(rimGeom, rimMat);
      login3DGroup.add(rimMesh);

      // 2. Beveled Metallic Rings Front & Back
      const bevelGeom = new THREE.TorusGeometry(2.86, 0.05, 16, 64);
      const bevelMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        metalness: 0.9,
        roughness: 0.2,
        emissive: 0x0284c7,
        emissiveIntensity: 0.3
      });
      const bevelFront = new THREE.Mesh(bevelGeom, bevelMat);
      bevelFront.position.z = 0.18;
      login3DGroup.add(bevelFront);

      const bevelBack = new THREE.Mesh(bevelGeom, bevelMat);
      bevelBack.position.z = -0.18;
      login3DGroup.add(bevelBack);

      // 3. Face Textures (NESAS Official Emblem)
      const textureNesas = createMedalCanvasTexture('assets/logo-nesas.png', 'NESAS', 'SMKN 1 SUMEDANG', '#2563eb', '#0f172a', '#1e293b');
      const textureNesasBack = createMedalCanvasTexture('assets/logo-nesas.png', 'SECURITY GATEWAY', 'SMART RFID ACCESS', '#0284c7', '#090d16', '#1e293b');

      const faceGeom = new THREE.CircleGeometry(2.83, 64);

      const faceFront = new THREE.Mesh(faceGeom, new THREE.MeshStandardMaterial({
        map: textureNesas,
        roughness: 0.25,
        metalness: 0.3
      }));
      faceFront.position.z = 0.185;
      login3DGroup.add(faceFront);

      const faceBack = new THREE.Mesh(faceGeom, new THREE.MeshStandardMaterial({
        map: textureNesasBack,
        roughness: 0.25,
        metalness: 0.3
      }));
      faceBack.position.z = -0.185;
      faceBack.rotation.y = Math.PI;
      login3DGroup.add(faceBack);

      // 4. Gyroscopic Orbital Rings for Login
      const ringGeom1 = new THREE.TorusGeometry(3.45, 0.025, 16, 80);
      const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65 });
      orbitalRing1 = new THREE.Mesh(ringGeom1, ringMat1);
      orbitalRing1.rotation.x = 1.15;
      login3DGroup.add(orbitalRing1);

      const ringGeom2 = new THREE.TorusGeometry(3.95, 0.02, 16, 80);
      const ringMat2 = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.5 });
      orbitalRing2 = new THREE.Mesh(ringGeom2, ringMat2);
      orbitalRing2.rotation.y = 0.75;
      orbitalRing2.rotation.x = -0.4;
      login3DGroup.add(orbitalRing2);

      // ==========================================
      // MODEL 3D #2: REGISTER (QUANTUM POLYHEDRON & INNOVATION MATRIX)
      // Visual 100% Berbeda Khusus Pendaftaran Kejuruan RPL
      // ==========================================
      register3DGroup = new THREE.Group();
      register3DGroup.scale.set(0.001, 0.001, 0.001);
      scene.add(register3DGroup);

      // 1. Outer Wireframe Cyber Polyhedron (Emerald Neon)
      const wireGeom = new THREE.IcosahedronGeometry(2.4, 1);
      const wireMat = new THREE.MeshStandardMaterial({
        color: 0x10b981,
        wireframe: true,
        emissive: 0x059669,
        emissiveIntensity: 0.7,
        roughness: 0.2
      });
      regWireframe = new THREE.Mesh(wireGeom, wireMat);
      register3DGroup.add(regWireframe);

      // 2. Inner Faceted Quantum Crystal (Cyber Violet)
      const crystalGeom = new THREE.OctahedronGeometry(1.85, 0);
      const crystalMat = new THREE.MeshStandardMaterial({
        color: 0x7c3aed,
        emissive: 0x4c1d95,
        emissiveIntensity: 0.55,
        metalness: 0.9,
        roughness: 0.15,
        transparent: true,
        opacity: 0.88
      });
      regCrystal = new THREE.Mesh(crystalGeom, crystalMat);
      register3DGroup.add(regCrystal);

      // 3. Central RPL Hologram Plate
      const textureRpl = createMedalCanvasTexture('assets/logo-rpl.png', 'RPL INNOVATION', 'REKAYASA PERANGKAT LUNAK', '#10b981', '#0f0b1e', '#064e3b');
      const rplPlateFront = new THREE.Mesh(faceGeom, new THREE.MeshStandardMaterial({
        map: textureRpl,
        roughness: 0.2,
        metalness: 0.4,
        transparent: true,
        opacity: 0.95
      }));
      rplPlateFront.position.z = 0.02;
      rplPlateFront.scale.set(0.68, 0.68, 0.68);
      register3DGroup.add(rplPlateFront);

      const rplPlateBack = new THREE.Mesh(faceGeom, new THREE.MeshStandardMaterial({
        map: textureRpl,
        roughness: 0.2,
        metalness: 0.4,
        transparent: true,
        opacity: 0.95
      }));
      rplPlateBack.position.z = -0.02;
      rplPlateBack.rotation.y = Math.PI;
      rplPlateBack.scale.set(0.68, 0.68, 0.68);
      register3DGroup.add(rplPlateBack);

      // 4. Three Intersecting Quantum Gimbal Rings (RGB Precision Spectrum)
      const gimbalGeom1 = new THREE.TorusGeometry(3.1, 0.03, 16, 80);
      const gimbalMat1 = new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.75 });
      regGimbal1 = new THREE.Mesh(gimbalGeom1, gimbalMat1);
      regGimbal1.rotation.x = Math.PI / 3;
      register3DGroup.add(regGimbal1);

      const gimbalGeom2 = new THREE.TorusGeometry(3.5, 0.025, 16, 80);
      const gimbalMat2 = new THREE.MeshBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.7 });
      regGimbal2 = new THREE.Mesh(gimbalGeom2, gimbalMat2);
      regGimbal2.rotation.y = Math.PI / 4;
      register3DGroup.add(regGimbal2);

      const gimbalGeom3 = new THREE.TorusGeometry(3.9, 0.02, 16, 80);
      const gimbalMat3 = new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.6 });
      regGimbal3 = new THREE.Mesh(gimbalGeom3, gimbalMat3);
      regGimbal3.rotation.z = Math.PI / 6;
      register3DGroup.add(regGimbal3);

      // 5. Floating Satellite Data Nodes (Micro Cubes in Dynamic Orbit)
      regSatellites = [];
      const satGeom = new THREE.BoxGeometry(0.24, 0.24, 0.24);
      for (let i = 0; i < 6; i++) {
        const satMat = new THREE.MeshStandardMaterial({
          color: (i % 2 === 0) ? 0x10b981 : 0xa855f7,
          emissive: (i % 2 === 0) ? 0x059669 : 0x7c3aed,
          emissiveIntensity: 0.6,
          metalness: 0.8,
          roughness: 0.2
        });
        const satMesh = new THREE.Mesh(satGeom, satMat);
        register3DGroup.add(satMesh);
        regSatellites.push(satMesh);
      }

      // ==========================================
      // GLOBAL PARTICLE DUST FIELD
      // ==========================================
      const partCount = 55;
      const partGeom = new THREE.BufferGeometry();
      const posArray = new Float32Array(partCount * 3);
      for (let i = 0; i < partCount * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 12;
        posArray[i + 1] = (Math.random() - 0.5) * 8;
        posArray[i + 2] = (Math.random() - 0.5) * 6;
      }
      partGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      const partMat = new THREE.PointsMaterial({ size: 0.04, color: 0x93c5fd, transparent: true, opacity: 0.75 });
      particleField = new THREE.Points(partGeom, partMat);
      scene.add(particleField);

      // Event Listeners
      setupInteractions(container);
      window.addEventListener('resize', onWindowResize);
      animate3D();
    }

    // Helper untuk membuat Texture Canvas Lingkaran Beresolusi Tinggi
    function createMedalCanvasTexture(imgSrc, title, subtitle, ringColor, bgCenter, bgEdge) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const cx = 512, cy = 512, r = 490;

      function drawTexture(img) {
        ctx.clearRect(0, 0, 1024, 1024);

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.clip();

        // Latar Belakang Gradasi Radial
        const bgGrad = ctx.createRadialGradient(cx, cy, 50, cx, cy, r);
        bgGrad.addColorStop(0, bgCenter);
        bgGrad.addColorStop(0.7, bgEdge);
        bgGrad.addColorStop(1, '#050811');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 1024, 1024);

        // Lingkaran Konsentris Tech
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.lineWidth = 2;
        for (let rad = 140; rad < 460; rad += 45) {
          ctx.beginPath();
          ctx.arc(cx, cy, rad, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Cincin Luar Neon Glow
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 16;
        ctx.shadowColor = ringColor;
        ctx.shadowBlur = 28;
        ctx.beginPath();
        ctx.arc(cx, cy, r - 12, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Cincin Metalik Dalam
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, r - 38, 0, Math.PI * 2);
        ctx.stroke();

        // Gambar Logo Asli di Tengah
        if (img) {
          const sz = 460;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
          ctx.shadowBlur = 30;
          ctx.shadowOffsetY = 15;
          ctx.drawImage(img, cx - sz / 2, cy - sz / 2 - 35, sz, sz);
          ctx.shadowBlur = 0;
          ctx.shadowOffsetY = 0;
        }

        // Teks Badge Bawah
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px "Plus Jakarta Sans", sans-serif';
        ctx.textAlign = 'center';
        ctx.letterSpacing = '1.5px';
        ctx.fillText(title, cx, 840);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.font = '700 22px "Plus Jakarta Sans", sans-serif';
        ctx.fillText(subtitle, cx, 885);

        // Pantulan Glossy Kaca (Sheen Curve)
        const sheen = ctx.createLinearGradient(0, 0, 1024, 600);
        sheen.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
        sheen.addColorStop(0.35, 'rgba(255, 255, 255, 0.05)');
        sheen.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = sheen;
        ctx.beginPath();
        ctx.ellipse(cx, 300, 480, 240, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawTexture(null);

      const texture = new THREE.CanvasTexture(canvas);
      texture.anisotropy = 8;

      const img = new Image();
      img.src = imgSrc;
      img.onload = () => {
        drawTexture(img);
        texture.needsUpdate = true;
      };

      return texture;
    }

    function setupInteractions(container) {
      window.addEventListener('mousemove', (e) => {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = -(e.clientY / window.innerHeight) * 2 + 1;
        mouseTiltX = y * 0.22;
        mouseTiltY = x * 0.26;
      });

      container.addEventListener('mousedown', (e) => {
        isDragging = true;
        previousMouseX = e.clientX;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - previousMouseX;
        currentRotationY += deltaX * 0.012;
        previousMouseX = e.clientX;
      });

      window.addEventListener('mouseup', () => { isDragging = false; });

      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          previousMouseX = e.touches[0].clientX;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        const deltaX = e.touches[0].clientX - previousMouseX;
        currentRotationY += deltaX * 0.012;
        previousMouseX = e.touches[0].clientX;
      }, { passive: true });

      window.addEventListener('touchend', () => { isDragging = false; });
    }

    function onWindowResize() {
      const container = document.getElementById('stage3dContainer');
      if (!container || !renderer || !camera) return;
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    let clock = new THREE.Clock();

    function animate3D() {
      requestAnimationFrame(animate3D);

      const elapsedTime = clock.getElapsedTime();

      // Smooth Lerp Spring ke Target Rotation jika sedang tidak di-drag
      if (!isDragging) {
        currentRotationY += (targetRotationY - currentRotationY) * 0.065;
      }

      currentTiltX += (mouseTiltX - currentTiltX) * 0.08;
      currentTiltY += (mouseTiltY - currentTiltY) * 0.08;

      // Dynamic scale transition between Login & Register 3D models
      loginScale += (targetLoginScale - loginScale) * 0.075;
      registerScale += (targetRegisterScale - registerScale) * 0.075;

      // 1. Model Login (Medallion) Animation
      if (login3DGroup) {
        login3DGroup.scale.set(loginScale, loginScale, loginScale);
        if (loginScale > 0.01) {
          login3DGroup.rotation.y = currentRotationY + currentTiltY;
          login3DGroup.rotation.x = currentTiltX;
          login3DGroup.position.y = Math.sin(elapsedTime * 1.6) * 0.16;

          if (orbitalRing1) orbitalRing1.rotation.z += 0.007;
          if (orbitalRing2) orbitalRing2.rotation.z -= 0.005;
        }
      }

      // 2. Model Register (Quantum Polyhedron) Animation
      if (register3DGroup) {
        register3DGroup.scale.set(registerScale, registerScale, registerScale);
        if (registerScale > 0.01) {
          register3DGroup.rotation.y = currentRotationY + currentTiltY + elapsedTime * 0.35;
          register3DGroup.rotation.x = currentTiltX + Math.sin(elapsedTime * 0.9) * 0.12;
          register3DGroup.position.y = Math.cos(elapsedTime * 1.8) * 0.16;

          if (regWireframe) {
            regWireframe.rotation.x += 0.008;
            regWireframe.rotation.y -= 0.01;
          }
          if (regCrystal) {
            regCrystal.rotation.x -= 0.01;
            regCrystal.rotation.z += 0.008;
          }
          if (regGimbal1) regGimbal1.rotation.z += 0.012;
          if (regGimbal2) regGimbal2.rotation.x -= 0.009;
          if (regGimbal3) regGimbal3.rotation.y += 0.007;

          regSatellites.forEach((sat, i) => {
            const angle = elapsedTime * 1.4 + (i * Math.PI / 3);
            const radius = 3.2 + Math.sin(elapsedTime + i) * 0.25;
            sat.position.x = Math.cos(angle) * radius;
            sat.position.z = Math.sin(angle) * radius;
            sat.position.y = Math.sin(angle * 2) * 0.7;
            sat.rotation.x += 0.02;
            sat.rotation.y += 0.03;
          });
        }
      }

      // Smooth Dynamic Lighting Transition
      if (bluePointLight && purplePointLight) {
        if (currentAuthMode === 'login') {
          bluePointLight.color.lerp(new THREE.Color(0x2563eb), 0.06);
          purplePointLight.color.lerp(new THREE.Color(0x06b6d4), 0.06);
        } else {
          bluePointLight.color.lerp(new THREE.Color(0xa855f7), 0.06);
          purplePointLight.color.lerp(new THREE.Color(0x10b981), 0.06);
        }
      }

      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      init3DScene();
    });

    // ===== 2. KONTROLER TAB & ANIMASI TRANSISI (MASUK / DAFTAR) =====
    function gantiTab(mode) {
      const fLog = document.getElementById('formLogin');
      const fReg = document.getElementById('formRegister');
      const tLog = document.getElementById('tabMasuk');
      const tReg = document.getElementById('tabDaftar');
      const wrap = document.getElementById('switchTabsWrap');
      const cap = document.getElementById('captionBawah');
      const flipper = document.getElementById('brandLogoFlipper');
      const cardTitle = document.getElementById('cardTitle');
      const cardSub = document.getElementById('cardSubtitle');
      const cardEl = document.querySelector('.login-card');

      bersihkanNotif();

      if (mode === 'login') {
        currentAuthMode = 'login';
        targetLoginScale = 1.0;
        targetRegisterScale = 0.001;
        targetRotationY = 0;

        // Smooth 3D Card Morph Transition
        if (cardEl) {
          cardEl.classList.remove('card-morph-to-reg');
          cardEl.classList.add('card-morph-to-log');
          setTimeout(() => cardEl.classList.remove('card-morph-to-log'), 650);
        }

        // Form View Cross-Fade
        fLog.style.display = 'block';
        fReg.style.display = 'none';
        setTimeout(() => {
          fLog.classList.add('active');
          fReg.classList.remove('active');
        }, 10);

        tLog.classList.add('active');
        tReg.classList.remove('active');
        wrap.classList.remove('is-register');
        flipper.classList.remove('is-flipped');

        cardTitle.textContent = 'Presensi Siswa';
        cardSub.textContent = 'Portal Presensi RFID & Akademik SMKN 1 Sumedang';
        cap.innerHTML = 'Belum punya akun? <a onclick="gantiTab(\'register\')">Daftar akun RPL</a>';
      } else {
        currentAuthMode = 'register';
        targetLoginScale = 0.001;
        targetRegisterScale = 1.0;
        targetRotationY = 0;

        // Smooth 3D Card Morph Transition
        if (cardEl) {
          cardEl.classList.remove('card-morph-to-log');
          cardEl.classList.add('card-morph-to-reg');
          setTimeout(() => cardEl.classList.remove('card-morph-to-reg'), 650);
        }

        // Form View Cross-Fade
        fLog.style.display = 'none';
        fReg.style.display = 'block';
        setTimeout(() => {
          fReg.classList.add('active');
          fLog.classList.remove('active');
        }, 10);

        tLog.classList.remove('active');
        tReg.classList.add('active');
        wrap.classList.add('is-register');
        flipper.classList.add('is-flipped');

        cardTitle.textContent = 'Pendaftaran Akun';
        cardSub.textContent = 'Kompetensi Keahlian Rekayasa Perangkat Lunak (RPL)';
        cap.innerHTML = 'Sudah punya akun? <a onclick="gantiTab(\'login\')">Masuk ke akun</a>';
      }
    }

    // Toggle Lihat / Sembunyikan Kata Sandi (Anti Typo)
    function togglePassword(inputId, btn) {
      const inp = document.getElementById(inputId);
      if (!inp) return;
      const isPass = inp.type === 'password';
      inp.type = isPass ? 'text' : 'password';
      const openIcon = btn.querySelector('.eye-open');
      const closedIcon = btn.querySelector('.eye-closed');
      if (openIcon && closedIcon) {
        openIcon.style.display = isPass ? 'none' : 'block';
        closedIcon.style.display = isPass ? 'block' : 'none';
      }
      btn.setAttribute('aria-label', isPass ? 'Sembunyikan kata sandi' : 'Lihat kata sandi');
    }

    // Modal Pemulihan / Lupa Password
    function bukaModalLupaPassword() {
      const emailField = document.getElementById('loginEmail');
      const resetEmailField = document.getElementById('resetEmail');
      if (emailField && resetEmailField && emailField.value.trim()) {
        resetEmailField.value = emailField.value.trim();
      }
      const b = document.getElementById('resetNotifBox');
      if (b) { b.style.display = 'none'; b.textContent = ''; }
      document.getElementById('modalLupaPassword').style.display = 'flex';
    }

    function tutupModalLupaPassword() {
      document.getElementById('modalLupaPassword').style.display = 'none';
    }

    async function handleKirimResetPassword(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const notif = document.getElementById('resetNotifBox');
      const btn = document.getElementById('btnKirimReset');

      btn.disabled = true;
      btn.textContent = 'Mengirim Tautan...';
      try {
        await kirimResetPassword(email);
        notif.style.display = 'block';
        notif.style.background = '#ecfdf5';
        notif.style.color = '#059669';
        notif.style.border = '1px solid #a7f3d0';
        notif.textContent = 'Link pemulihan kata sandi telah dikirim ke ' + email + '. Silakan periksa inbox / spam di Gmail Anda.';
        btn.textContent = 'Terkirim ✓';
        setTimeout(() => {
          tutupModalLupaPassword();
          btn.disabled = false;
          btn.textContent = 'Kirim Link Pemulihan';
        }, 4000);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Kirim Link Pemulihan';
        notif.style.display = 'block';
        notif.style.background = '#fef2f2';
        notif.style.color = '#dc2626';
        notif.style.border = '1px solid #fecaca';
        if (err.code === 'auth/user-not-found') {
          notif.textContent = 'Email belum terdaftar di sistem presensi.';
        } else if (err.code === 'auth/invalid-email') {
          notif.textContent = 'Format email tidak valid.';
        } else {
          notif.textContent = err.message || 'Gagal mengirim link pemulihan.';
        }
      }
    }

    function tampilNotif(pesan, tipe) {
      const b = document.getElementById('notifBox');
      b.textContent = pesan;
      b.className = tipe;
    }

    function bersihkanNotif() {
      const b = document.getElementById('notifBox');
      b.textContent = '';
      b.className = '';
    }

    function loading(show, text = 'Memproses...') {
      const l = document.getElementById('loadingBox');
      document.getElementById('loadingCaption').textContent = text;
      if (show) l.classList.add('show'); else l.classList.remove('show');
    }

    // Auto redirect jika session aktif
    const userSession = getSessionUser();
    if (userSession) {
      window.location.href = getDashboardUrlByRole(userSession.role);
    }

    // Login Google
    async function handleGoogleLogin() {
      bersihkanNotif();
      loading(true, 'Menghubungkan akun Google...');
      try {
        const result = await loginDenganGoogle();
        const userData = await prosesLoginUser(result.user);
        window.location.href = getDashboardUrlByRole(userData.role);
      } catch (e) {
        loading(false);
        if (e.code === 'auth/unauthorized-domain') {
          tampilNotif('Harap tambahkan domain lokal ke Firebase Console -> Auth -> Settings -> Authorized domains.', 'error');
        } else if (e.code === 'auth/popup-closed-by-user') {
          tampilNotif('Login dibatalkan.', 'error');
        } else {
          tampilNotif(e.message || 'Gagal login Google.', 'error');
        }
      }
    }

    // Login Email
    async function handleLoginEmail(e) {
      e.preventDefault();
      bersihkanNotif();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;

      loading(true, 'Memverifikasi akun...');
      try {
        const fbUser = await loginDenganEmail(email, pass);
        const userData = await prosesLoginUser(fbUser);
        window.location.href = getDashboardUrlByRole(userData.role);
      } catch (err) {
        loading(false);
        if (err.code === 'auth/email-not-verified') {
          tampilNotif('Email belum diverifikasi. Cek kotak masuk atau spam di Gmail Anda.', 'error');
        } else if (err.code === 'auth/operation-not-allowed') {
          tampilNotif('PENTING: Aktifkan Email/Password di Firebase Console -> Authentication -> Sign-in method.', 'error');
        } else {
          tampilNotif('Email atau kata sandi salah / belum terdaftar.', 'error');
        }
      }
    }

    // Register Email (Khusus Siswa & Wali Murid RPL: Hanya 3 Isian)
    async function handleRegisterEmail(e) {
      e.preventDefault();
      bersihkanNotif();
      const nama = document.getElementById('regNama').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPassword').value;

      loading(true, 'Mendaftarkan akun...');
      try {
        await registerDenganEmail(email, pass, nama);
        loading(false);
        tampilNotif('Link verifikasi telah dikirim ke ' + email + '. Buka Gmail Anda dan klik tautan verifikasi, lalu masuk.', 'success');
        document.getElementById('formRegister').reset();
        setTimeout(() => gantiTab('login'), 3500);
      } catch (err) {
        loading(false);
        if (err.code === 'auth/operation-not-allowed') {
          tampilNotif('Harap aktifkan provider Email/Password di Firebase Console -> Auth -> Sign-in method.', 'error');
        } else if (err.code === 'auth/email-already-in-use') {
          tampilNotif('Email ini sudah terdaftar. Silakan pilih Masuk.', 'error');
        } else {
          tampilNotif(err.message || 'Gagal mendaftar.', 'error');
        }
      }
    }
  </script>
</body>
</html>
