<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi Siswa - Login Admin</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body { align-items: center; }
  .login-wrap {
    background: #fff;
    border-radius: 20px;
    padding: 36px 28px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 40px -10px rgba(100,116,139,0.18), 0 2px 8px rgba(0,0,0,0.05);
  }
  .login-logo { text-align: center; margin-bottom: 28px; }
  .login-logo .logo-icon {
    width: 68px;
    height: 68px;
    background: linear-gradient(135deg, #0f172a, #334155);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 14px;
    box-shadow: 0 6px 18px rgba(15,23,42,0.3);
  }
  .login-logo h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .login-logo p { color: #64748b; font-size: 13.5px; }
  .login-field { margin-top: 18px; }
  .login-field label { margin-top: 0; margin-bottom: 7px; }
  .btn-login {
    margin-top: 24px;
    background: #0f172a;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-login:hover { background: #1e293b; }
  .back-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #94a3b8;
  }
  .back-link a { color: #2563eb; font-weight: 600; text-decoration: none; }
  .back-link a:hover { text-decoration: underline; }
  .error { margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="logo-icon">🛡️</div>
      <h1>Panel Admin</h1>
      <p>Login untuk Admin / Guru / Petugas Piket</p>
    </div>

    <form id="adminLoginForm">
      <div class="login-field">
        <label for="adminUser">Username Admin</label>
        <input type="text" id="adminUser" placeholder="Masukkan username" required>
      </div>
      <div class="login-field">
        <label for="adminPass">Password</label>
        <input type="password" id="adminPass" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn-login">🔐 Login Admin</button>
    </form>

    <p id="errorMsg" class="error"></p>

    <p class="back-link">
      Orang tua? <a href="index.html">← Kembali ke portal orang tua</a>
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="assets/firebase-config.js"></script>
  <script src="assets/admin-login.js"></script>
</body>
</html>
