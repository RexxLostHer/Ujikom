<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff & Admin Gateway — SMKN 1 Sumedang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  :root {
    --bg-deep: #050814;
    --card-bg: rgba(11, 18, 36, 0.88);
    --border-glass: rgba(56, 189, 248, 0.25);
    --border-glow: rgba(0, 240, 255, 0.45);
    --cyan: #00f0ff;
    --emerald: #10b981;
    --blue: #38bdf8;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'Plus Jakarta Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background-color: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* Cyber Grid Background */
  .bg-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(circle at 50% 20%, rgba(14, 165, 233, 0.15) 0%, transparent 60%),
      radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.10) 0%, transparent 50%),
      linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
  }

  /* Architectural Framing Lines */
  .frame-border {
    position: fixed;
    inset: 16px;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, 0.08);
    z-index: 1;
  }

  /* Main Container */
  .gateway-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 460px;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-glass);
    border-radius: 24px;
    padding: 38px 32px;
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                0 0 35px -5px rgba(0, 240, 255, 0.15);
  }

  /* Header Section */
  .gateway-header {
    text-align: center;
    margin-bottom: 26px;
  }

  .security-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 12px;
    border-radius: 9999px;
    background: rgba(14, 165, 233, 0.12);
    border: 1px solid rgba(14, 165, 233, 0.35);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .security-badge .dot-live {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulseDot 1.8s infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  .shield-icon-wrap {
    width: 64px;
    height: 64px;
    margin: 0 auto 16px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9));
    border: 1px solid var(--border-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 24px rgba(0, 240, 255, 0.25);
  }
  .shield-icon-wrap svg {
    width: 32px;
    height: 32px;
    color: var(--cyan);
  }

  .gateway-header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .gateway-header p {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }


  /* Inputs */
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: #cbd5e1;
    margin-bottom: 7px;
  }
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrapper input {
    width: 100%;
    padding: 12px 14px 12px 42px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    color: #ffffff;
    font-size: 14px;
    font-family: var(--font-sans);
    transition: all 0.2s ease;
  }
  .input-wrapper input:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.25);
    background: rgba(15, 23, 42, 0.95);
  }
  .input-wrapper input::placeholder {
    color: #64748b;
  }
  .input-icon {
    position: absolute;
    left: 14px;
    color: #64748b;
    font-size: 16px;
    pointer-events: none;
  }
  .toggle-pwd-btn {
    position: absolute;
    right: 12px;
    background: transparent;
    border: none;
    color: #64748b;
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
  }
  .toggle-pwd-btn:hover { color: #cbd5e1; }

  /* Submit Button */
  .btn-submit-gateway {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    background: linear-gradient(135deg, #0284c7, #0f766e);
    border: 1px solid rgba(0, 240, 255, 0.4);
    color: #ffffff;
    font-family: var(--font-sans);
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 8px 24px -6px rgba(2, 132, 199, 0.5);
    margin-top: 8px;
  }
  .btn-submit-gateway:hover {
    background: linear-gradient(135deg, #0369a1, #0d9488);
    box-shadow: 0 10px 28px -4px rgba(0, 240, 255, 0.4);
    transform: translateY(-1px);
  }
  .btn-submit-gateway:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* Notification Box */
  .notif-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.45;
    display: none;
  }
  .notif-box.error {
    display: block;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
  }
  .notif-box.success {
    display: block;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #6ee7b7;
  }
  .notif-box.warning {
    display: block;
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: #fcd34d;
  }

  /* Footer Link */
  .gateway-footer {
    margin-top: 24px;
    text-align: center;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 18px;
  }
  .gateway-footer a {
    color: #64748b;
    font-size: 13px;
    text-decoration: none;
    transition: color 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .gateway-footer a:hover {
    color: var(--blue);
  }

  /* Telemetry Meta */
  .telemetry-meta {
    margin-top: 16px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: #475569;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="frame-border"></div>

  <main class="gateway-card">
    <div class="gateway-header">
      <div class="security-badge">
        <span class="dot-live"></span>
        <span>RESTRICTED ACCESS • STAFF & ADMIN</span>
      </div>

      <div class="shield-icon-wrap">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>

      <h1>Portal Kontrol Administrator</h1>
      <p>Gerbang otentikasi khusus Administrator, Guru, & Petugas Piket SMKN 1 Sumedang</p>
    </div>

    <!-- Credentials Form -->
    <form id="adminLoginForm" onsubmit="handleStaffLoginEmail(event)">
      <!-- Google Sign-In Staff & Admin -->
      <button type="button" onclick="handleStaffLoginGoogle()" style="display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px;background:#ffffff;color:#0f172a;border:none;border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;margin-bottom:18px;box-shadow:0 4px 14px rgba(0,0,0,0.3);transition:all 0.22s ease;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Masuk dengan Akun Google (Staff / Admin)</span>
      </button>

      <div style="display:flex;align-items:center;gap:12px;margin:16px 0;opacity:0.6;">
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.2);"></div>
        <span style="font-size:11px;letter-spacing:0.1em;font-family:var(--font-mono);color:#94a3b8;">ATAU EMAIL KEDINASAN</span>
        <div style="flex:1;height:1px;background:rgba(255,255,255,0.2);"></div>
      </div>

      <div class="form-group">
        <label for="adminEmail">Alamat Email Kedinasan</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" id="adminEmail" placeholder="admin@smkn1sumedang.sch.id" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="adminPass">Kata Sandi</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="adminPass" placeholder="Masukkan kata sandi" required autocomplete="current-password">
          <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('adminPass', this)">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-submit-gateway" id="btnSubmitAdmin">
        🔐 Otentikasi & Masuk ke Panel
      </button>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;">
        <button type="button" onclick="masukSebagaiAdminDemo()" style="padding:10px;font-size:12px;font-weight:700;border-radius:10px;background:#38bdf8;color:#0f172a;border:none;cursor:pointer;">
          ⚡ Masuk Cepat Admin
        </button>
        <button type="button" onclick="masukSebagaiGuruDemo()" style="padding:10px;font-size:12px;font-weight:700;border-radius:10px;background:#10b981;color:#fff;border:none;cursor:pointer;">
          ⚡ Masuk Cepat Walas
        </button>
      </div>

      <div id="adminNotifBox" class="notif-box"></div>
    </form>

    <div class="gateway-footer">
      <a href="index.html">
        <span>←</span>
        <span>Kembali ke Portal Publik Siswa (index.html)</span>
      </a>
    </div>

    <div class="telemetry-meta">
      SECURE PROTOCOL // FIREBASE AUTH v10.12 // NESAS CLOUD
    </div>
  </main>

  <!-- FIREBASE & AUTH SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="assets/firebase-config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/admin-login.js"></script>
</body>
</html>
