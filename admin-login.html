<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Admin — SMKN 1 Sumedang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  :root {
    --bg-base: #06070a;
    --card-surface: rgba(13, 17, 23, 0.96);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(255, 255, 255, 0.2);
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --text-dim: #64748b;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background-color: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
    background-image: 
      radial-gradient(ellipse 60% 40% at 50% 10%, rgba(255, 255, 255, 0.035) 0%, transparent 70%),
      radial-gradient(circle 800px at 50% 90%, rgba(255, 255, 255, 0.015) 0%, transparent 60%);
  }

  /* Architectural Grid Lines (Subtle Monochrome) */
  .bg-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 80%);
  }

  /* Thin Viewport Frame Border */
  .frame-border {
    position: fixed;
    inset: 16px;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, 0.04);
    z-index: 1;
    border-radius: 12px;
  }

  /* Gateway Card Container */
  .gateway-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 440px;
    background: var(--card-surface);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--border-subtle);
    border-radius: 24px;
    padding: 40px 34px;
    box-shadow: 
      0 0 0 1px rgba(255, 255, 255, 0.03),
      0 24px 60px -12px rgba(0, 0, 0, 0.85);
    transition: border-color 0.3s ease;
  }

  /* Header Section */
  .gateway-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .security-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 13px;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    color: #e2e8f0;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .security-badge .dot-live {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    animation: pulseDot 2s infinite ease-in-out;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.8); }
  }

  .shield-icon-wrap {
    width: 58px;
    height: 58px;
    margin: 0 auto 18px;
    border-radius: 16px;
    background: #0f131a;
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }

  .gateway-header h1 {
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.025em;
    margin-bottom: 6px;
  }
  .gateway-header p {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* Form Controls */
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrapper input {
    width: 100%;
    padding: 12px 14px 12px 42px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    color: #ffffff;
    font-size: 13.5px;
    font-family: var(--font-sans);
    transition: all 0.2s ease;
  }
  .input-wrapper input:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.35);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
  }
  .input-wrapper input::placeholder {
    color: #475569;
  }
  .input-icon {
    position: absolute;
    left: 14px;
    color: #64748b;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .toggle-pwd-btn {
    position: absolute;
    right: 12px;
    background: transparent;
    border: none;
    color: #64748b;
    cursor: pointer;
    padding: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
  }
  .toggle-pwd-btn:hover {
    color: #e2e8f0;
    background: rgba(255, 255, 255, 0.06);
  }

  /* Primary Monochrome Executive Submit Button */
  .btn-submit-gateway {
    width: 100%;
    padding: 12.5px 16px;
    border-radius: 12px;
    background: #ffffff;
    border: 1px solid #ffffff;
    color: #090a0f;
    font-family: var(--font-sans);
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    margin-top: 6px;
  }
  .btn-submit-gateway:hover {
    background: #f1f5f9;
    border-color: #f1f5f9;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(255, 255, 255, 0.12);
  }
  .btn-submit-gateway:active {
    transform: translateY(0);
  }
  .btn-submit-gateway:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* Notification Box */
  .notif-box {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 12.5px;
    line-height: 1.5;
    display: none;
    border: 1px solid transparent;
  }
  .notif-box.error {
    display: block;
    background: rgba(239, 68, 68, 0.1);
    border-color: rgba(239, 68, 68, 0.3);
    color: #fca5a5;
  }
  .notif-box.success {
    display: block;
    background: rgba(16, 185, 129, 0.1);
    border-color: rgba(16, 185, 129, 0.3);
    color: #6ee7b7;
  }
  .notif-box.warning {
    display: block;
    background: rgba(245, 158, 11, 0.1);
    border-color: rgba(245, 158, 11, 0.3);
    color: #fcd34d;
  }

  /* Footer Link */
  .gateway-footer {
    margin-top: 24px;
    text-align: center;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    padding-top: 20px;
  }
  .gateway-footer a {
    color: #64748b;
    font-size: 12.5px;
    text-decoration: none;
    transition: color 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .gateway-footer a:hover {
    color: #e2e8f0;
  }
</style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="frame-border"></div>

  <main class="gateway-card">
    <div class="gateway-header">
      <div class="security-badge">
        <span class="dot-live"></span>
        <span>RESTRICTED ACCESS • STAFF & ADMIN</span>
      </div>

      <div class="shield-icon-wrap">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>

      <h1>Portal Kontrol Administrator</h1>
      <p>SMKN 1 Sumedang</p>
    </div>

    <!-- Credentials Form -->
    <form id="adminLoginForm" onsubmit="handleStaffLoginEmail(event)">
      <div class="form-group">
        <label for="adminEmail">Email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
          <input type="email" id="adminEmail" placeholder="admin@smkn1sumedang.sch.id" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="adminPass">Kata Sandi</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="adminPass" placeholder="Masukkan kata sandi" required autocomplete="current-password">
          <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('adminPass', this)" title="Lihat kata sandi">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit-gateway" id="btnSubmitAdmin">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        <span>Masuk</span>
      </button>

      <div id="adminNotifBox" class="notif-box"></div>
    </form>

    <div class="gateway-footer">
      <a href="index.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Kembali ke Portal Utama</span>
      </a>
    </div>
  </main>

  <!-- FIREBASE & AUTH SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="assets/firebase-config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/admin-login.js"></script>
</body>
</html>
